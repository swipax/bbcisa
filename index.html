<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yama Önceliği Panosu — CISA KEV + EPSS</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --panel-2: #182130;
    --border: #232d3d;
    --text: #e6edf3;
    --muted: #8a97a8;
    --accent: #ff5c5c;
    --accent-2: #ffb454;
    --ok: #5fd18b;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  header {
    padding: 28px 32px 18px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 0.2px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  #meta { color: var(--muted); font-size: 12px; margin-top: 8px; font-family: var(--mono); }

  .controls {
    display: flex;
    gap: 10px;
    padding: 16px 32px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .controls input, .controls select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .controls input { flex: 1; min-width: 200px; }

  main { padding: 20px 32px 60px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    color: var(--muted);
    font-weight: 600;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg);
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: var(--panel); }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; font-family: var(--mono);
  }
  .badge.overdue { background: rgba(255,92,92,0.15); color: var(--accent); }
  .badge.soon { background: rgba(255,180,84,0.15); color: var(--accent-2); }
  .badge.ok { background: rgba(95,209,139,0.15); color: var(--ok); }

  .cve { font-family: var(--mono); color: var(--text); }
  .desc { color: var(--muted); max-width: 420px; }
  .epss { font-family: var(--mono); }

  #empty { display: none; color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>Yama Önceliği Panosu</h1>
    <p>CISA Known Exploited Vulnerabilities (KEV) kataloğu + FIRST.org EPSS istismar olasılığı skorları ile günlük olarak yeniden hesaplanan yama önceliği listesi.</p>
    <div id="meta">Yükleniyor…</div>
  </header>

  <div class="controls">
    <input id="search" type="text" placeholder="CVE, ürün veya tedarikçiye göre ara…" />
    <select id="ransomwareFilter">
      <option value="">Ransomware kullanımı: hepsi</option>
      <option value="Known">Bilinen ransomware kullanımı</option>
      <option value="Unknown">Bilinmiyor</option>
    </select>
    <select id="sortBy">
      <option value="urgency">Sırala: öncelik puanı</option>
      <option value="due">Sırala: son tarih</option>
      <option value="epss">Sırala: EPSS skoru</option>
    </select>
  </div>

  <main>
    <table>
      <thead>
        <tr>
          <th>Öncelik</th>
          <th>CVE</th>
          <th>Tedarikçi / Ürün</th>
          <th>Açıklama</th>
          <th>Son Tarih</th>
          <th>EPSS</th>
          <th>Ransomware</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty">Filtreyle eşleşen kayıt yok.</div>
  </main>

<script>
let DATA = { records: [] };

function badgeForDueDate(days) {
  if (days === null || days === undefined) return '<span class="badge ok">—</span>';
  if (days < 0) return `<span class="badge overdue">${Math.abs(days)} gün gecikti</span>`;
  if (days <= 7) return `<span class="badge soon">${days} gün kaldı</span>`;
  return `<span class="badge ok">${days} gün kaldı</span>`;
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const ransomFilter = document.getElementById('ransomwareFilter').value;
  const sortBy = document.getElementById('sortBy').value;

  let rows = DATA.records.filter(r => {
    const hay = `${r.cve_id} ${r.vendor} ${r.product}`.toLowerCase();
    const matchesQuery = !q || hay.includes(q);
    const matchesRansom = !ransomFilter || (r.ransomware_use || 'Unknown').startsWith(ransomFilter);
    return matchesQuery && matchesRansom;
  });

  rows = rows.slice().sort((a, b) => {
    if (sortBy === 'due') return (a.days_remaining ?? 9999) - (b.days_remaining ?? 9999);
    if (sortBy === 'epss') return (b.epss_score ?? 0) - (a.epss_score ?? 0);
    return (b.urgency_score ?? 0) - (a.urgency_score ?? 0);
  });

  const tbody = document.getElementById('rows');
  const empty = document.getElementById('empty');
  tbody.innerHTML = '';
  empty.style.display = rows.length ? 'none' : 'block';

  for (const r of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="mono">${r.urgency_score ?? '—'}</td>
      <td class="cve">${r.cve_id}<br><span class="desc">${r.vulnerability_name || ''}</span></td>
      <td>${r.vendor || '—'}<br><span class="desc">${r.product || ''}</span></td>
      <td class="desc">${r.short_description || ''}</td>
      <td>${r.due_date || '—'}<br>${badgeForDueDate(r.days_remaining)}</td>
      <td class="epss">${r.epss_score != null ? (r.epss_score * 100).toFixed(1) + '%' : '—'}</td>
      <td>${r.ransomware_use || 'Unknown'}</td>
    `;
    tbody.appendChild(tr);
  }
}

async function load() {
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    DATA = await res.json();
    document.getElementById('meta').textContent =
      `${DATA.count} kayıt · son güncelleme: ${new Date(DATA.generated_at).toLocaleString('tr-TR')}`;
    render();
  } catch (e) {
    document.getElementById('meta').textContent = 'data.json yüklenemedi — henüz ilk Actions çalışması yapılmamış olabilir.';
  }
}

['search', 'ransomwareFilter', 'sortBy'].forEach(id =>
  document.getElementById(id).addEventListener('input', render)
);

load();
</script>
</body>
</html>
